name: SEC data audit (read-only)

# Manual only: produces the Phase 1 financial-data audit report (Issue #2) from SEC EDGAR,
# which this repo's cloud sessions can't reach. It reads public SEC data and changes nothing.
# The job output is public: enter public example tickers only, never a list of private holdings.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated public example tickers (output is public; no private holdings)"
        required: true
        default: "MSFT MU RIVN BRK-B JPM AVGO"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TICKERS: ${{ inputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # say plainly when SEC requests won't carry a name and email (never prints the value)
      - name: Check SEC identification
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning title=SEC_USER_AGENT not set::Add the SEC_USER_AGENT repository secret (a name and email). Without it SEC requests use a generic identifier and SEC may refuse some."
          fi
      - name: Audit SEC financial data
        id: audit
        # exit code 0 = every company retrieved, 1 = some, 2 = none; publish the report either way
        run: |
          set +e
          python -m stockwatch.sec_audit $TICKERS --markdown sec-audit.md --json sec-audit.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat sec-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-data-audit
          path: |
            sec-audit.md
            sec-audit.json
      # a green run must mean SEC data was actually retrieved
      - name: Check the audit retrieved data
        run: |
          case "${{ steps.audit.outputs.code }}" in
            0) echo "COMPLETE: every company retrieved" ;;
            1) echo "::warning title=SEC audit PARTIAL::Some companies were unavailable; see the report" ;;
            *) echo "::error title=SEC audit NO DATA::No company could be retrieved from SEC"; exit 1 ;;
          esac
