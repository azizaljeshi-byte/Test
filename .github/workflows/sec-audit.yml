name: SEC data audit (read-only)

# Manual only: produces the Phase 1 financial-data audit and the Phase 1B data-quality report (Issue #2)
# from SEC EDGAR, which this repo's cloud sessions can't reach. It reads public SEC data and changes nothing.
# The job output is public: enter public example tickers only, never a list of private holdings.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated public example tickers (output is public; no private holdings)"
        required: true
        default: "MSFT MU RIVN BRK-B JPM AVGO"
      reconcile:
        description: "Tickers (among those above) whose fiscal-year figures are also checked against the filing itself"
        required: false
        default: "MSFT MU AVGO"
      valuation:
        description: "Tickers for the read-only valuation research (Phase 2A-1); public examples only"
        required: false
        default: "MSFT AVGO MU JPM RIVN BRK-B"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TICKERS: ${{ inputs.tickers }}
      RECONCILE: ${{ inputs.reconcile }}
      VALUATION: ${{ inputs.valuation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # say plainly when SEC requests won't carry a name and email (never prints the value)
      - name: Check SEC identification
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning title=SEC_USER_AGENT not set::Add the SEC_USER_AGENT repository secret (a name and email). Without it SEC requests use a generic identifier and SEC may refuse some."
          fi
      - name: Audit SEC financial data
        id: audit
        # exit code 0 = every company retrieved, 1 = some, 2 = none; publish the report either way
        run: |
          set +e
          python -m stockwatch.sec_audit $TICKERS --markdown sec-audit.md --json sec-audit.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat sec-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check SEC data quality (Phase 1B)
        id: quality
        # same exit codes; the report also goes to the log so it can be read without the artifact
        run: |
          set +e
          python -m stockwatch.sec_quality $TICKERS --reconcile $RECONCILE --markdown sec-quality.md --json sec-quality.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat sec-quality.md >> "$GITHUB_STEP_SUMMARY"
          cat sec-quality.md
      - name: Valuation research (Phase 2A-1, read-only)
        id: valuation
        if: env.VALUATION != ''
        # research only: no fair value, BUY/SELL or score; the report also goes to the log
        run: |
          set +e
          python -m stockwatch.valuation_lab $VALUATION --markdown valuation.md --json valuation.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat valuation.md >> "$GITHUB_STEP_SUMMARY"
          cat valuation.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-data-audit
          path: |
            sec-audit.md
            sec-audit.json
            sec-quality.md
            sec-quality.json
            valuation.md
            valuation.json
      # a green run must mean SEC data was actually retrieved
      - name: Check the audit retrieved data
        run: |
          case "${{ steps.audit.outputs.code }}" in
            0) echo "COMPLETE: every company retrieved" ;;
            1) echo "::warning title=SEC audit PARTIAL::Some companies were unavailable; see the report" ;;
            *) echo "::error title=SEC audit NO DATA::No company could be retrieved from SEC"; exit 1 ;;
          esac
          case "${{ steps.quality.outputs.code }}" in
            0) echo "COMPLETE: data-quality report for every company" ;;
            1) echo "::warning title=SEC data quality PARTIAL::Some companies were unavailable; see the report" ;;
            *) echo "::error title=SEC data quality NO DATA::No company could be retrieved from SEC"; exit 1 ;;
          esac
