name: StockWatch scan

on:
  schedule:
    # every 15 min on weekdays, 4am-8pm New York (pre-market through after-hours), covering EDT and EST.
    # GitHub may delay scheduled runs by a few minutes.
    - cron: "*/15 8-23 * * 1-5"
    - cron: "*/15 0-1 * * 2-6"
    # S&P 500 opportunity scan once a day before the open (8:50am New York in summer, 7:50am in winter)
    - cron: "50 12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run. The default sends nothing."
        type: choice
        default: holdings-dry-run
        options:
          - holdings-dry-run
          - holdings-scan
          - telegram-check
          - telegram-test-send
          - market-scan
      confirm:
        description: "Type SEND to allow telegram-test-send (one fixed test message, no holdings)"
        required: false
        default: ""

concurrency:
  group: stockwatch-scan
  cancel-in-progress: false

jobs:
  scan:
    # schedule: the live holdings scan; manual runs: whichever holdings/Telegram mode was picked.
    # It always runs: a missing notification secret is reported, not a reason to skip the scan.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '50 12 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'market-scan')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event_name == 'schedule' && 'holdings-scan' || inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      STOCKWATCH_PORTFOLIO: ${{ secrets.STOCKWATCH_PORTFOLIO }}
      STOCKWATCH_SHEET_URL: ${{ secrets.STOCKWATCH_SHEET_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      STOCKWATCH_STATE_KEY: ${{ secrets.STOCKWATCH_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: SEC identification
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning title=SEC_USER_AGENT not set::Add the SEC_USER_AGENT repository secret (a name and email). Without it SEC requests use a generic identifier and SEC may refuse some."
          fi
      # The alert memory between runs (each tracked stock's last call), encrypted with STOCKWATCH_STATE_KEY.
      # Actions caches in a public repo are readable by anyone who can open a pull request, so only the
      # encrypted file is cached: the scan's own database (share counts, costs, prices) is never kept.
      - if: startsWith(env.MODE, 'holdings')
        uses: actions/cache/restore@v4
        with:
          path: data/alert_state.bin
          key: stockwatch-alert-state-${{ github.run_id }}
          restore-keys: stockwatch-alert-state-
      - name: Run ${{ env.MODE }}
        run: python -m stockwatch.ci_scan --mode "$MODE" --confirm "$CONFIRM"
      # saved even when the run is red: the memory only records changes that were actually delivered,
      # so a failed send stays pending and is retried next run
      - if: always() && env.MODE == 'holdings-scan' && hashFiles('data/alert_state.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: data/alert_state.bin
          key: stockwatch-alert-state-${{ github.run_id }}

  market:
    # The S&P 500 discovery scan isn't part of the tracked fleet, so it doesn't message Telegram unless the
    # owner opts in with the repository variable STOCKWATCH_SP500_PUSH = true. Without it, the daily run is
    # skipped and a manual market-scan only prints the setups to the log.
    if: >-
      (github.event.schedule == '50 12 * * 1-5' && vars.STOCKWATCH_SP500_PUSH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'market-scan')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STOCKWATCH_PORTFOLIO: ${{ secrets.STOCKWATCH_PORTFOLIO }}
      STOCKWATCH_SHEET_URL: ${{ secrets.STOCKWATCH_SHEET_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: SEC identification
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning title=SEC_USER_AGENT not set::Add the SEC_USER_AGENT repository secret (a name and email). Without it SEC requests use a generic identifier and SEC may refuse some."
          fi
      - name: Scan the S&P 500 (push only with STOCKWATCH_SP500_PUSH = true)
        run: python -m stockwatch.market ${{ vars.STOCKWATCH_SP500_PUSH == 'true' && '--notify' || '' }}
