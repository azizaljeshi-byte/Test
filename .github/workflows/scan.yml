name: StockWatch scan

on:
  schedule:
    # every 15 min on weekdays, 4am-8pm New York (pre-market through after-hours), covering EDT and EST.
    # GitHub may delay scheduled runs by a few minutes.
    - cron: "*/15 8-23 * * 1-5"
    - cron: "*/15 0-1 * * 2-6"
    # S&P 500 opportunity scan once a day before the open (8:50am New York in summer, 7:50am in winter)
    - cron: "50 12 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: stockwatch-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.schedule != '50 12 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STOCKWATCH_PORTFOLIO: ${{ secrets.STOCKWATCH_PORTFOLIO }}
      STOCKWATCH_SHEET_URL: ${{ secrets.STOCKWATCH_SHEET_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      # nothing to do until a notification channel is configured, so don't burn a runner on it
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$NTFY_TOPIC" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "No NTFY_TOPIC or TELEGRAM_BOT_TOKEN secret set - skipping scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cfg.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      # keep the alert history between runs so the same alert isn't re-sent every 15 min
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: data/stockwatch.db
          key: stockwatch-db-${{ github.run_id }}
          restore-keys: stockwatch-db-
      - if: steps.cfg.outputs.enabled == 'true'
        name: Scan and notify
        run: python -m stockwatch.scanner --once

  market:
    if: github.event.schedule == '50 12 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STOCKWATCH_PORTFOLIO: ${{ secrets.STOCKWATCH_PORTFOLIO }}
      STOCKWATCH_SHEET_URL: ${{ secrets.STOCKWATCH_SHEET_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$NTFY_TOPIC" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "No notification channel configured - skipping market scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cfg.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      - if: steps.cfg.outputs.enabled == 'true'
        name: Scan the S&P 500 and push the top setups
        run: python -m stockwatch.market --notify
