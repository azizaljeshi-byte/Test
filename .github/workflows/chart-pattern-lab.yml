name: Chart Pattern Lab (research only)
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Public example ticker only; never private holdings
        required: true
        default: MSFT
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EXAMPLE_TICKER: ${{ inputs.ticker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check SEC identification
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning title=SEC_USER_AGENT not set::SEC requests require a configured contact identifier"
          fi
      - name: Generate isolated research report
        shell: bash
        run: |
          [[ "$EXAMPLE_TICKER" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,14}$ ]] || exit 2
          python -m stockwatch.chart_patterns "$EXAMPLE_TICKER" --output chart-lab/report
          cat chart-lab/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-pattern-research
          path: chart-lab/
